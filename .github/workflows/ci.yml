name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-x86:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler \
            libprotobuf-dev \
            cmake \
            g++-13

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: cd build && ctest --output-on-failure --timeout 120

  build-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler and arm64 libraries
        run: |
          # The toolchain file expects the unversioned aarch64-linux-gnu-g++,
          # and linking needs an aarch64 build of protobuf, which only exists
          # on the ubuntu-ports archive — hence the multiarch setup.
          # The Azure mirror is listed first because the runners live on
          # Azure and the canonical ports.ubuntu.com has had outages that
          # failed this job; apt tries the URIs in order.
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^Signed-By:/Architectures: amd64\nSigned-By:/' /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' \
            'Types: deb' \
            'URIs: http://azure.ports.ubuntu.com/ubuntu-ports http://ports.ubuntu.com/ubuntu-ports' \
            'Suites: noble noble-updates noble-security' \
            'Components: main universe restricted multiverse' \
            'Architectures: arm64' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            | sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.sources > /dev/null
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 \
            g++-aarch64-linux-gnu \
            protobuf-compiler \
            libprotobuf-dev:arm64

      - name: Configure (cross-compile)
        run: |
          cmake -B build-arm \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-aarch64.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF

      - name: Build
        run: cmake --build build-arm -j$(nproc)

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler \
            libprotobuf-dev \
            cmake \
            g++-13

      - name: Build with ASan + UBSan
        run: |
          cmake -B build-san \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DENABLE_SANITIZERS=ON \
            -DBUILD_TESTS=ON
          cmake --build build-san -j$(nproc)

      - name: Test with sanitizers
        run: cd build-san && ctest --output-on-failure --timeout 120
